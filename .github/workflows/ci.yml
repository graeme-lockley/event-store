name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.4.x

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Unit Test Event Store
        run: |
          chmod +x gradlew
          ./gradlew :event-store:test

      - name: Integration Test Event Store
        id: integration_test
        run: |
          chmod +x gradlew
          ./gradlew :event-store-integration:test --info
        continue-on-error: true

      - name: Parse and Display Test Summary
        if: always()
        run: |
          echo "=========================================="
          echo "Integration Test Summary"
          echo "=========================================="
          echo ""
          
          # Check if test results exist
          if [ -d "event-store-integration/build/test-results/test" ]; then
            # Count tests
            total_tests=$(find event-store-integration/build/test-results/test -name "*.xml" -exec grep -h "tests=" {} \; | sed 's/.*tests="\([0-9]*\)".*/\1/' | awk '{sum+=$1} END {print sum}')
            failed_tests=$(find event-store-integration/build/test-results/test -name "*.xml" -exec grep -h "failures=" {} \; | sed 's/.*failures="\([0-9]*\)".*/\1/' | awk '{sum+=$1} END {print sum}')
            errors=$(find event-store-integration/build/test-results/test -name "*.xml" -exec grep -h "errors=" {} \; | sed 's/.*errors="\([0-9]*\)".*/\1/' | awk '{sum+=$1} END {print sum}')
            skipped=$(find event-store-integration/build/test-results/test -name "*.xml" -exec grep -h "skipped=" {} \; | sed 's/.*skipped="\([0-9]*\)".*/\1/' | awk '{sum+=$1} END {print sum}')
            
            passed=$((total_tests - failed_tests - errors - skipped))
            
            echo "Total Tests: ${total_tests:-0}"
            echo "Passed: ${passed:-0}"
            echo "Failed: ${failed_tests:-0}"
            echo "Errors: ${errors:-0}"
            echo "Skipped: ${skipped:-0}"
            echo ""
            
            # List all test classes and their results
            echo "Test Scenarios:"
            echo "----------------------------------------"
            for xml_file in event-store-integration/build/test-results/test/*.xml; do
              if [ -f "$xml_file" ]; then
                classname=$(grep -o 'classname="[^"]*"' "$xml_file" | head -1 | sed 's/classname="\([^"]*\)".*/\1/')
                testname=$(grep -o 'name="[^"]*"' "$xml_file" | head -1 | sed 's/name="\([^"]*\)".*/\1/')
                failures=$(grep -o 'failures="[0-9]*"' "$xml_file" | head -1 | sed 's/failures="\([0-9]*\)".*/\1/')
                errors=$(grep -o 'errors="[0-9]*"' "$xml_file" | head -1 | sed 's/errors="\([0-9]*\)".*/\1/')
                
                if [ "${failures:-0}" = "0" ] && [ "${errors:-0}" = "0" ]; then
                  echo "  ✓ $classname.$testname"
                else
                  echo "  ✗ $classname.$testname (FAILED)"
                fi
              fi
            done
            echo ""
          else
            echo "No test results found"
          fi
          
          echo "=========================================="

      - name: Display Test Details
        if: always()
        run: |
          echo "=========================================="
          echo "Detailed Test Results"
          echo "=========================================="
          echo ""
          
          # Show details for each test
          for xml_file in event-store-integration/build/test-results/test/*.xml; do
            if [ -f "$xml_file" ]; then
              classname=$(grep -o 'classname="[^"]*"' "$xml_file" | head -1 | sed 's/classname="\([^"]*\)".*/\1/')
              echo "Test Class: $classname"
              echo "----------------------------------------"
              
              # Extract test cases
              grep -o '<testcase[^>]*>' "$xml_file" | while read -r testcase; do
                testname=$(echo "$testcase" | grep -o 'name="[^"]*"' | sed 's/name="\([^"]*\)".*/\1/')
                time=$(echo "$testcase" | grep -o 'time="[^"]*"' | sed 's/time="\([^"]*\)".*/\1/')
                echo "  - $testname (${time}s)"
              done
              
              # Show failures if any
              if grep -q '<failure' "$xml_file"; then
                echo ""
                echo "  Failures:"
                grep -A 5 '<failure' "$xml_file" | head -20
              fi
              
              # Show errors if any
              if grep -q '<error' "$xml_file"; then
                echo ""
                echo "  Errors:"
                grep -A 5 '<error' "$xml_file" | head -20
              fi
              
              echo ""
            fi
          done

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-reports
          path: |
            event-store-integration/build/test-results/test/**/*.xml
            event-store-integration/build/reports/tests/test/**
          retention-days: 30

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-logs
          path: |
            event-store-integration/build/test-results/test/**/*.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Fail if tests failed
        if: steps.integration_test.outcome == 'failure'
        run: |
          echo "Integration tests failed. Check the test summary and details above."
          exit 1