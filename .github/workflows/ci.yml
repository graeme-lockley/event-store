name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.4.x

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Unit Test Event Store
        run: |
          chmod +x gradlew
          ./gradlew :event-store:test

      - name: Integration Test Event Store
        id: integration_test
        run: |
          chmod +x gradlew
          ./gradlew :event-store-integration:test --info
        continue-on-error: true

      - name: Display Test Results
        if: always()
        run: |
          ./integration-tests/tasks/display-test-results.sh

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            event-store-integration/build/test-results/test/**/*.xml
            event-store-integration/build/reports/tests/test/**
          retention-days: 30

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: |
            event-store-integration/build/test-results/test/**/*.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Fail if tests failed
        if: steps.integration_test.outcome == 'failure'
        run: |
          echo "Integration tests failed. Check the test summary and details above."
          exit 1